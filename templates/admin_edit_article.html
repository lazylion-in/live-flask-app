<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Article - Lazy Lion Admin</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <style>body { background-color: #f8f9fa; padding: 40px; }</style>
</head>
<body>
    <div class="container" style="max-width: 800px;">
        <div class="card shadow">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <h4 class="mb-0">Edit Article</h4>
                <a href="/admin" class="btn btn-sm btn-light">Cancel</a>
            </div>
            <div class="card-body">
                <form method="POST">
                    <!-- Headline Input -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">Headline</label>
                        <input type="text" class="form-control form-control-lg" name="headline" value="{{ article.headline }}" required>
                    </div>

                    <!-- Commentary (Content) Input -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">Article Content (Commentary)</label>
                        <textarea class="form-control" name="commentary" rows="12" required>{{ article.commentary }}</textarea>
                        <div class="form-text">This is the main text displayed on the article page.</div>
                    </div>

                    <!-- Meta Description (Optional Read-only view or editable if you want later) -->
                    <div class="mb-3">
                        <label class="form-label text-muted">Slug (Cannot be changed)</label>
                        <input type="text" class="form-control bg-light" value="{{ article.slug }}" readonly>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-success btn-lg">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
